[project]
name = "triage-agent"
version = "0.1.0"
description = "Autonomous SBOM Vulnerability Intelligence and Triage Multi-Agent System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.47.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
triage-agent = "triage_agent.cli:main"
triage-verifier = "triage_agent.verifier:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

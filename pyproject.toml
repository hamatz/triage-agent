[project]
name = "triage-agent"
version = "0.3.0"
description = "Autonomous SBOM Vulnerability Intelligence and Triage Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.47.0",
    "pydantic>=2.14.1",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.4",
    "rich>=13.0.0",
]

[project.scripts]
triage-agent = "triage_agent.cli:main"
triage-verifier = "triage_agent.verifier:main"
triage-ui = "triage_agent.web_ui:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"triage_agent" = ["data/*.toml", "data/*.json"]
"triage_agent.ui" = ["templates/*.html", "static/*.css", "static/*.js"]

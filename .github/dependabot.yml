# Dependabot configuration for triage-agent
# Keeps "SBOM Currency" and "Tool Currency" continuously updated (ADR-018)
version: 2
updates:
  # 1. Python Dependencies (pyproject.toml & requirements.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # 2. GitHub Actions (Pinned SHA action workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

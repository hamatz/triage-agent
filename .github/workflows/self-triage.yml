name: Scheduled Self-Triage & Dogfooding (ADR-018)

on:
  schedule:
    # Every Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-triage:
    name: Run triage-agent Self-Triage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2 (Pinned SHA for supply-chain security)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # actions/setup-python@v5.4.0 (Pinned SHA)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        # Install pinned dependencies from requirements-lock.txt to ensure reproducible audit and Dependabot updates (ADR-018)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Execute Self-Triage Audit
        id: self_triage
        # The API key is passed to this step only (not job-wide), so that dependency installation and
        # third-party actions never see it. Later steps read the execution mode from this step's output.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x ./scripts/self_triage.sh
          if [ -n "${GEMINI_API_KEY:-}" ] || [ "${GOOGLE_GENAI_USE_VERTEXAI:-}" = "true" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "🚀 GEMINI_API_KEY / Vertex AI を検出したため、ライブモードで自己診断を実行します。"
            ./scripts/self_triage.sh
          else
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "ℹ️ GEMINI_API_KEY 未設定のため、--dry-run（オフラインシミュレーション）で実行します。"
            ./scripts/self_triage.sh --dry-run
          fi

      - name: Output High-Level Status Summary (ADR-013 Attack Map Prevention)
        # Never output specific file paths or vulnerable call details to public step summaries
        if: always()
        env:
          RUN_MODE: ${{ steps.self_triage.outputs.mode }}
        run: |
          echo "## 🛡️ triage-agent Self-Triage Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${RUN_MODE}" = "live" ]; then
            echo "> 🚀 **実行モード:** Live（GEMINI_API_KEY / Vertex AI による推論あり）" >> $GITHUB_STEP_SUMMARY
          elif [ "${RUN_MODE}" = "dry-run" ]; then
            echo "> ℹ️ **実行モード:** Dry-Run（シミュレーション / APIキー未設定のためオフライン静的解析で疎通確認を実施）" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ **実行モード:** 不明（自己診断のステップが開始前に失敗しました）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f triage_self_audit.md ]; then
            echo "| 監査メトリクス | 件数 |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            TOTAL=$(grep -E '総検査項目数' triage_self_audit.md | awk -F':' '{print $2}' || echo "0 件")
            YES_COUNT=$(grep -E '判定: YES' triage_self_audit.md | awk -F':' '{print $2}' || echo "0 件")
            UNCONFIRMED=$(grep -E '判定: コード内未検出' triage_self_audit.md | awk -F':' '{print $2}' || echo "0 件")
            echo "| 総検査項目数 | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| 判定: YES (要対応・実地確認) | ${YES_COUNT} |" >> $GITHUB_STEP_SUMMARY
            echo "| 判定: 要確認 (外部設定/既定値) | ${UNCONFIRMED} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ レポートファイルが生成されませんでした。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Self-Triage Reports (Restricted Artifact)
        # actions/upload-artifact@v4.6.1 (Pinned SHA)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: self-triage-reports
          path: |
            self_sbom.json
            triage_self_report.md
            triage_self_audit.md
          retention-days: 14

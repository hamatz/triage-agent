name: Scheduled Self-Triage & Dogfooding (ADR-018)

on:
  schedule:
    # Every Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-triage:
    name: Run triage-agent Self-Triage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Execute Self-Triage Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x ./scripts/self_triage.sh
          ./scripts/self_triage.sh

      - name: Output Summary to GitHub Step Summary
        run: |
          echo "## 🛡️ triage-agent Self-Triage Audit Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f triage_self_audit.md ]; then
            head -n 25 triage_self_audit.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Self-Triage Reports
        uses: actions/upload-artifact@v4
        with:
          name: self-triage-reports
          path: |
            self_sbom.json
            triage_self_report.md
            triage_self_audit.md
          retention-days: 30

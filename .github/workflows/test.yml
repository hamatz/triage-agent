name: Unit & Benchmark Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2 (Pinned SHA for supply-chain security)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # actions/setup-python@v5.4.0 (Pinned SHA)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -r requirements-lock.txt
          fi
          pip install pytest
          pip install -e .

      - name: Run Test Suite
        run: |
          pytest tests/ -v || python -m unittest discover -s tests -p "test_*.py" -v

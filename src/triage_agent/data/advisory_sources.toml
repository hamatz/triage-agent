[[sources]]
id = "tomcat-announce"
name = "Apache Tomcat Security Announcements"
ecosystem = "Maven"
package_patterns = [
    "org.apache.tomcat:*", "tomcat", "tomcat-*", "tomcat-catalina", "tomcat-coyote",
    "tomcat-embed-*", "tomcat-embed-core"
]

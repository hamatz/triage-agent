keywords = ["security release", "pre-announcement", "cve"]
default_preparations = [
    "当該日の輪番要員の手配・翌日代休の事前調整",
    "ベンダー作業枠の事前仮押さえ",
    "本番変更管理申請（RFC）の先行起票",
]


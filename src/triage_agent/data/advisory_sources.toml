# advisory_sources.toml
# コミュニティ主導の事前予告・セキュリティリリース監視カタログ (ADR-020)
#
# 本ファイルはオープンな宣言型データとして管理され、誰でもPRで新しいOSS監視ソースを追加できます。
# 1段目として決定論的に参照され、APIキー不要・高速に事前予告やリリース予定日を抽出します。

[[sources]]
id = "nodejs-security"
name = "Node.js Security Releases"
ecosystem = "npm"
package_patterns = ["node", "nodejs"]
purl_patterns = ["pkg:npm/node*", "pkg:generic/node*"]
url = "https://nodejs.org/en/blog/vulnerability/"
feed_url = "https://nodejs.org/en/feed/vulnerability.xml"
type = "rss_feed"
is_official = true
cadence_hint = "事前予告は通常、セキュリティリリースの3〜7日前に公式ブログで公開されます。"
keywords = ["security release", "vulnerabilities", "pre-announcement", "upcoming"]
default_preparations = [
    "当該日の輪番要員の手配・翌日代休の事前調整",
    "ベンダー作業枠の事前仮押さえ",
    "本番変更管理申請（RFC）の先行起票",
]

[[sources]]
id = "openssl-announce"
name = "OpenSSL Security Releases"
ecosystem = "generic"
package_patterns = ["openssl", "libssl", "openssl-devel"]
purl_patterns = ["pkg:generic/openssl*", "pkg:deb/openssl*", "pkg:rpm/openssl*"]
url = "https://mta.openssl.org/pipermail/openssl-announce/"
type = "mailing_list_html"
is_official = true
cadence_hint = "最高深刻度（CRITICAL/HIGH）を含むセキュリティリリースは数日前に事前通知されます。"
keywords = ["sec-announce", "security advisory", "release announcement"]
default_preparations = [
    "当該日の輪番要員の手配・翌日代休の事前調整",
    "ベンダー作業枠の事前仮押さえ",
    "本番変更管理申請（RFC）の先行起票",
]


[[sources]]
id = "oracle-cpu"
name = "Oracle Critical Patch Update (CPU)"
ecosystem = "Maven"
package_patterns = ["com.oracle:*", "oracle:*", "openjdk", "java"]
purl_patterns = ["pkg:maven/com.oracle*/*", "pkg:generic/oracle*", "pkg:generic/openjdk*"]
type = "fixed_schedule"
is_official = true
cadence_hint = "四半期ごと（1月・4月・7月・10月の第3火曜日）に定期公開される包括的セキュリティパッチ。"
schedule_rule = "third_tuesday"
schedule_months = [1, 4, 7, 10]
schedule_time_utc = "21:00 UTC" # 米国太平洋時間 13:00 PT = 21:00 UTC (日本時間 翌水曜 06:00 JST)
schedule_source_url = "https://www.oracle.com/security-alerts/"
url = "https://www.oracle.com/security-alerts/"
default_preparations = [
    "四半期パッチ適用枠の事前確保（第3火曜日翌朝/水曜日以降）",
    "Java/ミドルウェア担当ベンダーの作業枠仮押さえ",
    "本番変更管理申請（RFC）の先行起票",
]


events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    server {
        listen       443 ssl;
        server_name  example.com;

        ssl_certificate      cert.pem;
        ssl_certificate_key  cert.key;

        # Disable in staging:
        # http2 off;

        # Vulnerable to Rapid Reset / HTTP2Shell when HTTP/2 is enabled:
        http2 on;

        location / {
            root   html;
            index  index.html index.htm;
        }
    }
}
